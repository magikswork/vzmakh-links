@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F151E; --grid:rgba(140,172,214,.06); --card:#17202C; --ink:#E7ECF3; --muted:#97A4B6; --line:#283445;
  --red:#FF6B5D; --orange:#FF9C4A; --blue:#86AEE3; --blue-soft:#1C2A3C; --orange-soft:#2E2117; --focus:#FF9C4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F151E; --grid:rgba(140,172,214,.06); --card:#17202C; --ink:#E7ECF3; --muted:#97A4B6; --line:#283445;
  --red:#FF6B5D; --orange:#FF9C4A; --blue:#86AEE3; --blue-soft:#1C2A3C; --orange-soft:#2E2117; --focus:#FF9C4A; color-scheme:dark}

body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
#root{max-width:880px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}

/* header */
.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{width:84px;height:84px;flex:none;border-radius:50%;background:#fff var(--logo) center/cover no-repeat;box-shadow:0 0 0 4px var(--orange),0 6px 18px rgba(20,30,50,.12)}
.top-text{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.05;margin:0;text-wrap:balance}
h1 .accent{color:var(--orange)}
.meta{font-family:var(--hand);font-size:21px;color:var(--blue);line-height:1.1}
.btn{font:600 14px/1 var(--body);border-radius:999px;padding:11px 18px;border:2px solid transparent;cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-danger{background:transparent;color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn[disabled]{opacity:.55;cursor:default}

/* search + nav */
.tools{display:flex;flex-direction:column;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px;margin-block:-10px;background:linear-gradient(var(--paper) 78%,transparent)}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:500 16px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 48px 13px 46px}
.search input:focus{outline:none;border-color:var(--orange)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 13px var(--body);color:var(--blue);background:var(--blue-soft);border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
.chip:hover{color:var(--ink)}

/* sections */
.section{display:flex;flex-direction:column;gap:12px;scroll-margin-top:130px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0;letter-spacing:-.01em}
.sec-note{font-family:var(--hand);font-size:20px;color:var(--orange);line-height:1}

/* class tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:12px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}.tile a{padding:10px 8px;min-height:0;align-items:center;text-align:center}.tile .num{font-size:34px}.tile .lbl{font-size:12px}.tile .tsub{display:none}.tile .icon-btn{top:2px;right:2px;width:26px;height:26px}}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--orange);transform:translateY(-2px)}
.tile a{display:flex;flex-direction:column;gap:2px;padding:14px 16px 14px;text-decoration:none;border-radius:16px;min-height:96px;box-sizing:border-box}
.tile .num{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.tile .lbl{font-weight:600;font-size:14px}
.tile .tsub{font-size:12px;color:var(--muted)}
.tile .wide{font-family:var(--display);font-weight:500;font-size:16px;line-height:1.15;color:var(--red);overflow-wrap:anywhere}

/* rows */
.list{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-right:8px}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--blue-soft) 55%,transparent)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:13px 8px 13px 16px;text-decoration:none;border-radius:12px}
.badge{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.badge.form{background:var(--orange-soft);color:var(--orange)}
.row-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.new{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.icon-btn{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--blue-soft);color:var(--ink)}
.tile .icon-btn{position:absolute;top:6px;right:6px;width:30px;height:30px}
.row-actions{display:flex;gap:2px}

.results{display:flex;flex-direction:column;gap:28px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:22px;color:var(--muted);text-align:center}
.foot{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;border-top:2px dashed var(--line);padding-top:16px}

/* editor panel */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,16,26,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.overlay{align-items:center}}
.panel{width:100%;max-width:520px;max-height:100%;overflow:auto;box-sizing:border-box;background:var(--card);color:var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.panel h3{font-family:var(--display);font-weight:500;font-size:19px;margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{font:500 15px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
.field input:focus,.field select:focus{outline:none;border-color:var(--orange)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--red);font-weight:600}
.panel-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel-actions .spacer{flex:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px;border-radius:999px;padding:11px 18px;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.notice{background:var(--orange-soft);color:var(--ink);border-radius:14px;padding:12px 16px;font-size:14px}
.tile .num{overflow-wrap:anywhere}

</style>

 и сводные", "title": "Сводная по олимпиадам", "url": "https://docs.google.com/spreadsheets/d/1lUnfCV-liQiFLEkg-ExmtR4HSEvNgCl5Houyto9zi2s/edit?gid=0#gid=0", "note": "", "added": ""}, {"section": "Кружки и продлёнка", "title": "Отметка о проведённых кружках", "url": "https://docs.google.com/spreadsheets/d/1xknAZgifOLA4Y4ex3YT6gqQf0B6yHSRB4ZVYTpqCJZ4/edit?usp=sharing", "note": "", "added": ""}, {"section": "Кружки и продлёнка", "title": "Фиксация продлёнки", "url": "https://docs.google.com/forms/d/e/1FAIpQLSd6uAbBDcAIQnAyMBjE2VSlchI3qhE948EzzQH5S1kMAiDJoQ/viewform?usp=preview", "note": "", "added": ""}, {"section": "Кружки и продлёнка", "title": "Кружки", "url": "https://docs.google.com/spreadsheets/d/1hIBIgVFWxZZYX5tq9cwfObJ6jQddwcUw/edit?usp=drivesdk&ouid=116544808773050621379&rtpof=true&sd=true", "note": "филиал на Власова", "added": ""}]</script>
<script>
(function(){
  /* Ссылки берутся из Google Таблицы. Новая ссылка = новая строка в таблице. */
  var SHEET_ID = '1UY_XcfzF1YTbd897pu5wK3SRHbOopWxKYMN85TjFGUg';
  var NEW_DAYS = 14;
  var CACHE_KEY = 'vzmakh-links-v1';
  var SNAPSHOT = JSON.parse(document.getElementById('hub-snapshot').textContent);

  var root = document.getElementById('root');
  var links = [];          // {section, title, url, note, added}
  var status = 'loading';  // loading | fresh | cached | snapshot
  var query = '';

  /* ---------- helpers ---------- */
  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function(c){ if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function norm(s){ return String(s || '').toLowerCase().replace(/ё/g,'е'); }
  function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : '#'; }
  function kind(url){
    var u = String(url || '');
    if (/docs\.google\.com\/spreadsheets/.test(u)) return {label:'Таблица', cls:'sheet'};
    if (/docs\.google\.com\/forms|forms\.gle/.test(u)) return {label:'Форма', cls:'form'};
    if (/docs\.google\.com\/document/.test(u)) return {label:'Документ', cls:'doc'};
    if (/docs\.google\.com\/presentation/.test(u)) return {label:'Презентация', cls:'slides'};
    if (/drive\.google\.com/.test(u)) return {label:'Папка на Диске', cls:'drive'};
    try { return {label:new URL(u).hostname.replace(/^www\./,''), cls:'web'}; } catch(e){ return {label:'Ссылка', cls:'web'}; }
  }
  var ICONS = {
    sheet:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M4 9h16M4 15h16M10 9v12"/></svg>',
    form:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8.5l1.5 1.5L12 7.5M14 9h2.5M8 15l1.5 1.5L12 14M14 15.5h2.5"/></svg>',
    doc:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>',
    slides:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M12 17v3M8 20h8"/></svg>',
    drive:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    web:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
  };
  var I_COPY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>';
  var I_SEARCH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';

  /* "21.10.2026", "2026-10-21", "Date(2026,9,21)" → Date */
  function parseDate(s){
    s = String(s || '').trim(); var m;
    if ((m = /^Date\((\d+),(\d+),(\d+)/.exec(s))) return new Date(+m[1], +m[2], +m[3]);
    if ((m = /^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/.exec(s))) return new Date(+m[3], +m[2]-1, +m[1]);
    if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return new Date(+m[1], +m[2]-1, +m[3]);
    return null;
  }
  function isNew(l){ var d = parseDate(l.added); return !!d && (Date.now() - d.getTime()) < NEW_DAYS * 864e5 && d.getTime() <= Date.now() + 864e5; }
  function plural(n, a, b, c){ var m10=n%10, m100=n%100; return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c); }

  function slug(s){
    var map = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
    return norm(s).split('').map(function(ch){ return map[ch] !== undefined ? map[ch] : ch; }).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'razdel';
  }
  /* "Классы — значимые оценки…" → {title:"Классы", note:"значимые оценки…"} */
  function splitSection(name){
    var parts = String(name || 'Другое').split(/\s+[—–-]\s+/);
    var title = parts.shift().trim() || 'Другое';
    return {title:title, note:parts.join(' — ').trim(), id:slug(title)};
  }
  function groupSections(list){
    var order = [], byName = {};
    list.forEach(function(l){
      var key = l.section || 'Другое';
      if (!byName[key]){ var s = splitSection(key); s.items = []; byName[key] = s; order.push(s); }
      byName[key].items.push(l);
    });
    order.forEach(function(s){ s.tiles = s.items.length > 0 && s.items.every(function(l){ return /^\d{1,2}\s/.test(l.title + ' '); }); });
    return order;
  }

  var toastTimer;
  function toast(msg, ms){
    var t = document.getElementById('toast');
    if (!t){ t = el('div',{id:'toast','class':'toast',role:'status'}); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, ms || 2600);
  }
  function copy(url){
    function fallback(){ toast('Не получилось скопировать — откройте ссылку и скопируйте из адресной строки'); }
    try { navigator.clipboard.writeText(url).then(function(){ toast('Ссылка скопирована'); }, fallback); } catch(e){ fallback(); }
  }

  /* ---------- render ---------- */
  function matches(l, sec){
    if (!query) return true;
    var hay = norm([l.title, l.note, sec.title, sec.note, kind(l.url).label].join(' '));
    return norm(query).split(/\s+/).filter(Boolean).every(function(w){ return hay.indexOf(w) !== -1; });
  }
  function renderTile(l){
    var m = /^(\d{1,2})\s*(.*)$/.exec(l.title || '');
    var a = el('a',{href:safeUrl(l.url),target:'_blank',rel:'noopener'});
    a.appendChild(el('span',{'class':'num',text:m ? m[1] : l.title}));
    a.appendChild(el('span',{'class':'lbl',text:m ? (m[2] || 'класс') : ''}));
    var sub = el('span',{'class':'tsub',text: l.note || kind(l.url).label});
    if (isNew(l)) sub.appendChild(el('span',{'class':'new',text:'новое'}));
    a.appendChild(sub);
    return el('div',{'class':'tile'},[a]);
  }
  function renderRow(l){
    var k = kind(l.url);
    var title = el('span',{'class':'row-title'},[l.title]);
    if (isNew(l)) title.appendChild(el('span',{'class':'new',text:'новое'}));
    var main = el('a',{'class':'row-main',href:safeUrl(l.url),target:'_blank',rel:'noopener'},[
      el('span',{'class':'badge ' + k.cls,'aria-hidden':'true',html:ICONS[k.cls] || ICONS.web}),
      el('span',{'class':'row-text'},[title, el('span',{'class':'row-sub',text: l.note ? (l.note + ' · ' + k.label) : k.label})])
    ]);
    return el('div',{'class':'row'},[main, el('div',{'class':'row-actions'},[
      el('button',{'class':'icon-btn',type:'button','aria-label':'Скопировать ссылку «'+l.title+'»',title:'Скопировать ссылку',html:I_COPY,onclick:function(){ copy(l.url); }})
    ])]);
  }

  function render(){
    root.innerHTML = '';
    var sections = groupSections(links);
    var total = links.length;
    var meta = status === 'loading' ? 'загружаю свежий список…'
      : total + ' ' + plural(total,'ссылка','ссылки','ссылок') + (status === 'fresh' ? ' · актуально' : '');
    root.appendChild(el('header',{'class':'top'},[
      el('div',{'class':'logo',role:'img','aria-label':'Логотип частной школы «Взмах», Москва'}),
      el('div',{'class':'top-text'},[
        el('div',{'class':'eyebrow',text:'Частная школа «Взмах» · Москва'}),
        el('h1',{html:'Все рабочие <span class="accent">ссылки</span>'}),
        el('div',{'class':'meta',text:meta})
      ])
    ]));
    if (status === 'cached' || status === 'snapshot'){
      root.appendChild(el('div',{'class':'notice',role:'status',text:'Не удалось загрузить свежий список — показана сохранённая версия. Обновите страницу чуть позже.'}));
    }

    var input = el('input',{id:'q',type:'search',placeholder:'Найти: 5 класс, олимпиады…',autocomplete:'off','aria-label':'Поиск по ссылкам',value:query,
      oninput:function(e){ query = e.target.value; renderResults(); }});
    var chips = el('nav',{'class':'chips','aria-label':'Разделы'}, sections.map(function(s){
      return el('button',{'class':'chip',type:'button',text:s.title,onclick:function(){
        if (query){ query=''; input.value=''; renderResults(); }
        var t = document.getElementById(s.id); if (t) t.scrollIntoView({behavior:'smooth',block:'start'});
      }});
    }));
    root.appendChild(el('div',{'class':'tools'},[
      el('div',{'class':'search'},[el('span',{html:I_SEARCH}), input, el('kbd',{text:'/'})]),
      chips
    ]));
    root.appendChild(el('div',{id:'results','class':'results'}));
    renderResults();
    root.appendChild(el('footer',{'class':'foot'},[
      el('span',{text:'Ссылки открываются в Google Таблицах и Формах — доступ к самим файлам выдаётся там.'}),
      el('span',{text:'Нужна новая ссылка или что-то не открывается — напишите в общий чат.'})
    ]));
  }

  function renderResults(){
    var box = document.getElementById('results'); box.innerHTML = '';
    var shown = 0;
    groupSections(links).forEach(function(s){
      var items = s.items.filter(function(l){ return matches(l, s); });
      if (!items.length) return;
      shown += items.length;
      var head = el('div',{'class':'sec-head'},[el('h2',{text:s.title}), s.note ? el('span',{'class':'sec-note',text:s.note}) : null]);
      var body = s.tiles ? el('div',{'class':'tiles'}, items.map(renderTile)) : el('div',{'class':'list'}, items.map(renderRow));
      box.appendChild(el('section',{'class':'section',id:s.id,'aria-label':s.title},[head, body]));
    });
    if (!shown && status !== 'loading'){
      box.appendChild(el('div',{'class':'empty',text: query ? 'По запросу «' + query + '» ничего не нашлось. Попробуйте другое слово.' : 'Ссылок пока нет.'}));
    }
  }

  /* ---------- data: Google Таблица через JSONP (работает без серверов) ---------- */
  function fromGviz(resp){
    if (!resp || resp.status === 'error' || !resp.table) return null;
    var out = [];
    (resp.table.rows || []).forEach(function(r){
      var c = r.c || [];
      function v(i){ var x = c[i]; if (!x) return ''; return String(x.f != null ? x.f : (x.v != null ? x.v : '')).trim(); }
      var row = {section:v(0), title:v(1), url:v(2), note:v(3), added:v(4)};
      if (row.title && /^https?:\/\//i.test(row.url)) out.push(row);
    });
    return out;
  }
  function useCacheOrSnapshot(){
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){}
    if (cached && cached.length){ links = cached; status = 'cached'; }
    else { links = SNAPSHOT; status = 'snapshot'; }
    render();
  }
  function load(){
    var done = false;
    var cb = '__vzmakhLinks' + Date.now();
    var timer = setTimeout(function(){ if (!done){ done = true; useCacheOrSnapshot(); } }, 9000);
    window[cb] = function(resp){
      if (done) return; done = true; clearTimeout(timer);
      var data = fromGviz(resp);
      if (data && data.length){
        links = data; status = 'fresh';
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e){}
        render();
      } else useCacheOrSnapshot();
    };
    var s = document.createElement('script');
    s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?headers=1&tqx=out:json;responseHandler:' + cb + '&_=' + Date.now();
    s.onerror = function(){ if (!done){ done = true; clearTimeout(timer); useCacheOrSnapshot(); } };
    document.head.appendChild(s);
  }

  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      e.preventDefault(); var q = document.getElementById('q'); if (q) q.focus();
    }
  });

  /* first frame: last saved list (or built-in), then fresh data from the sheet */
  try { var c0 = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c0 && c0.length) links = c0; } catch(e){}
  if (!links.length) links = SNAPSHOT;
  render();
  load();
})();

</script>
